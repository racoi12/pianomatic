[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pianomatic"
version = "0.1.0"
description = "Local, open-source AI piano coach"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "mido>=1.3",
    "pymatchmaker[devices]>=0.3.0",
    "music21>=9.1",
    "numpy",
]
# mido, python-rtmidi, and numpy are also pulled in transitively by
# pymatchmaker[devices], but listed explicitly since pianomatic imports
# them directly (midi_io.py, diff.py).

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gui = ["PySide6>=6.5"]

[project.scripts]
pianomatic = "pianomatic.cli:main"
pianomatic-gui = "pianomatic.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

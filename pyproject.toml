[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pianomatic"
version = "0.1.0"
description = "Coach de piano con IA, 100% local y open-source"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "mido>=1.3",
    "pymatchmaker[devices]>=0.3.0",
    "music21>=9.1",
]
# mido and python-rtmidi are also pulled in transitively by
# pymatchmaker[devices], but listed explicitly since pianomatic imports
# them directly in midi_io.py.

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pianomatic = "pianomatic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
